<html>
    <head>
        <title>JavaScript basics</title>
    </head>
    <body>
        <script>
            /*Multi Line Commentfunction name(parameter1, parameter2, parameter){
                //code to be executed
            }
            */

            //1.Function Defination one time
            function sum(x, y){
                console.log(x+y);
            }
            //2. function Calling many times

            sum(10, 15);  // Actual Arguments/Parameters
            sum(40, 60);
            sum(39, 56);
            sum(747,87);

            function subtraction(x, y){
                console.log(x-y);
            }
            function mul_add(x, y, z){
                console.log(x*y*z+x);
            }
            function div_sub(x, y, z){
                console.log(x/y-z);
            }

            subtraction(25, 76);
            mul_add(45, 65, 89);
            div_sub(45, 5, 87);

            function greet(First_name, last_name){
               console.log(`Hello ${First_name} ${last_name} How are you`); 
            }

            greet("Manshi", "Rana");
        </script>
    </body>
</html>
