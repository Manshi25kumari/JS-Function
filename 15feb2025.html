<html>
    <head>
        <title>Naming Convention</title>
    </head>
    <body>
        <script>
            //Naming convention in JavaScript
            //camleCase for variable and Function/Method

            var manshiRana
            var swetaKumari
            manshiRana = 10;
            swetaKumari = 20;

            console.log(manshiRana + swetaKumari);

            //Function Defination
            function morningGreet(first_name, last_name){
                console.log("good moening " + first_name + last_name);
            }

            morningGreet('Manshi', 'Rana');

            //PI 22/7 or 3.14
            const PI=3.14;
            console.log(PI);

            const AB = 34;
            console.log(AB);

        </script>
    </body>
</html>
